name: Build Rectify12 foundation

on:
  push:
    branches:
      - rectify12-foundation
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify bundled cursor pack
        shell: pwsh
        run: |
          $cursorPack = 'assets/cursors/Rectify12-cursors-jepricreations.zip'
          $expectedHash = '04c9a4797f02ab88fd5df15a9377a32b3f66497f05caf89460f3441968a7024c'
          $actualHash = (Get-FileHash -LiteralPath $cursorPack -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Bundled cursor pack checksum mismatch. Expected $expectedHash, got $actualHash."
          }

      - name: Build Release x64
        shell: pwsh
        run: msbuild Rectify11Installer.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Collect Rectify12 package
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Recurse -File -Include Rectify12Installer.exe,Rectify12ControlPanel.exe,Base.dll,Controls.dll,PageRes.dll,segoe_r11.ttf | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts -Force
          }
          Copy-Item assets/cursors/Rectify12-cursors-jepricreations.zip artifacts/Rectify12-cursors-jepricreations.zip -Force
          Copy-Item docs/setup-contract.md artifacts/setup-contract.md -Force

          $cursorArchive = 'artifacts/Rectify12-cursors-jepricreations.zip'
          $cursorHash = (Get-FileHash $cursorArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cursorHash -ne '04c9a4797f02ab88fd5df15a9377a32b3f66497f05caf89460f3441968a7024c') {
            throw "Cursor asset hash mismatch: $cursorHash"
          }

          $cursorCheck = Join-Path $env:RUNNER_TEMP 'rectify12-cursor-check'
          Expand-Archive -LiteralPath $cursorArchive -DestinationPath $cursorCheck -Force
          if (-not (Test-Path (Join-Path $cursorCheck 'light/Install.inf'))) { throw 'Light cursor Install.inf is missing' }
          if (-not (Test-Path (Join-Path $cursorCheck 'dark/Install.inf'))) { throw 'Dark cursor Install.inf is missing' }
          if (-not (Select-String -LiteralPath (Join-Path $cursorCheck 'light/Install.inf') -Pattern 'W11 Cursor Light Free by Jepri Creations' -Quiet)) { throw 'Unexpected light cursor scheme' }
          if (-not (Select-String -LiteralPath (Join-Path $cursorCheck 'dark/Install.inf') -Pattern 'W11 Cursor Dark Free by Jepri Creations' -Quiet)) { throw 'Unexpected dark cursor scheme' }

      - name: Upload Rectify12 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Rectify12-foundation-x64
          path: artifacts
          if-no-files-found: error
